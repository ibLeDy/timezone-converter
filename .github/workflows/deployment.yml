name: deployment

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate release version
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          tag = os.environ['GITHUB_REF_NAME']
          with open('pyproject.toml', 'rb') as config:
              version = tomllib.load(config)['project']['version']

          if tag != f'v{version}' and tag != version:
              print(
                  f'Release tag {tag!r} does not match '
                  f'pyproject.toml version {version!r}.',
              )
              sys.exit(1)
          PY

      - name: Install dependencies
        run: python -m pip install --upgrade pip -e . -r requirements-dev.txt

      - name: Run tests
        run: coverage run -m pytest && coverage report

  docker:
    needs: test
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build for this runner's architecture only and load it into the local
      # daemon, so the image can actually be run before anything is pushed. A
      # multi-arch build cannot be loaded, which is why this is a separate
      # step from the push below.
      - name: Build amd64 image for smoke testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: timezone-converter:smoke

      # Exercises the packaged CLI entrypoint, not the test suite: the
      # release image deliberately excludes tests (see .dockerignore).
      - name: Smoke test the image
        run: |
          docker run --rm timezone-converter:smoke --version
          docker run --rm timezone-converter:smoke tijuana new_york
          docker run --rm timezone-converter:smoke --list tbd

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: bledy/timezone-converter
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # PyPI is gated on the image being built, smoke tested and pushed, because
  # a release on PyPI cannot be taken back: a version number is burned even
  # if it is yanked. A Docker Hub outage therefore blocks the PyPI publish,
  # which is the intended trade-off.
  pypi:
    needs: docker
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Build a binary wheel and a source tarball
        run: python -m build --sdist --wheel --outdir=dist/ .

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@release/v1
