version: 2

updates:
  # Action versions are the supply-chain surface that moves fastest, and a
  # stale pinned action is the one most likely to break a release.
  #
  # Grouped into one PR: one PR per action hit Dependabot's limit of five
  # open PRs, which held the rest back, and each merge left the others
  # behind main.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
    labels:
      - ci
      - dependencies

  # Runtime and development dependencies move more slowly, and pre-commit.ci
  # already opens its own monthly autoupdate PR for the hooks.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    labels:
      - dependencies

  # The Dockerfile's base image. Without this nothing proposes updates to it.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    labels:
      - dependencies
